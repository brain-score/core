################################################################
#### poetry config ####
################################################################

[project]
name = "brainscore_core"
version = "2.3.8"
description = ""
authors = []
license = { 'file' = 'LICENSE' }
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "tqdm",
    "numpy<2",
    "boto3", # AWS S3 client for brainio lite
    "netCDF4", # NetCDF file format for brainio lite
    "xarray==2022.3.0",  # tested pre-index-refactor release; keep unified installs reproducible
    "pandas", # DataFrames for brainio lite
    "Pillow", # Image processing for brainio lite
    "psycopg2-binary", # postgres driver
    # submission
    "fire",
    "peewee",
    "pybtex",
    "requests",
]

[project.optional-dependencies]
test = [
    "imageio",
    "moto",
    "pytest",
    "pytest-check",
    "pytest-mock",
    "requests-mock"]

[build-system]
requires = [
    "setuptools>=65,<69",
    "wheel"
]
build-backend = "setuptools.build_meta"

################################################################
#### mypy type-checking config ####
################################################################

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
files = [
    "brainscore_core/model_interface.py",
    "brainscore_core/compatibility.py",
    "brainscore_core/memory.py",
    "brainscore_core/capabilities",
    "brainscore_core/dispatch.py",
    "brainscore_core/brainscore_model.py",
    "brainscore_core/events.py",
    "brainscore_core/selection.py",
    "brainscore_core/recording.py",
    "brainscore_core/perturbation.py",
    "brainscore_core/behavioral.py",
    "brainscore_core/contract.py",
    "brainscore_core/capability_config.py",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (slow, requires real components)",
    "unit: marks tests as unit tests (fast, isolated)",
    "slow: marks tests as slow running tests",
    "memory_intense: tests requiring more memory than is available in the Travis sandbox (currently 3 GB)",
    "travis_slow: tests running for more than 10 minutes without output (which leads Travis to error)",
    "private_access: tests that require access to a private resource, such as assemblies on S3 (note that Travis builds originating from forks can not have private access)",
]

# Test discovery patterns
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Console output
console_output_style = "progress"

# Warnings configuration
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning", 
    "ignore::FutureWarning:brainscore_core.metrics*",
]

################################################################
#### setuptools packaging config ####
################################################################

[tool.setuptools.package-data]
# include bash files (e.g. 'test_plugin.sh') in package install
"brainscore_core.plugin_management" = ["**"]
