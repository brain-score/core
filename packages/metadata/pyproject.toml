[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "brainscore-metadata"
version = "0.1.0"
description = "Versioned model metadata validation and source policy"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.3,<7"]

[project.scripts]
brainscore-metadata = "brainscore_metadata.cli:main"

[tool.setuptools.packages.find]
include = ["brainscore_metadata*"]
