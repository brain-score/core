name: Metadata contract
on:
  pull_request:
    paths: ['packages/metadata/**', '.github/workflows/metadata-contract.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ./packages/metadata
      - run: python -m unittest discover -s packages/metadata/tests -v
