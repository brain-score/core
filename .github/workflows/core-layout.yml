name: Core layout compatibility
on:
  pull_request:
    branches: [unified-model-interface-v2]
    types: [opened, synchronize, reopened, labeled]
permissions:
  contents: read
jobs:
  compatibility:
    if: contains(github.event.pull_request.labels.*.name, 'test:package-compatibility')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RESULTCACHING_DISABLE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: KartikP/brainscore-unified
          ref: ee683a519301c500d213ef53f1ce90ee76f92550
          path: unified
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build both wheels in a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/layout-env"
          echo "$RUNNER_TEMP/layout-env/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/layout-env/bin/python" -m pip install build
          "$RUNNER_TEMP/layout-env/bin/python" -m build --wheel --outdir "$RUNNER_TEMP/base-wheel" baseline
          "$RUNNER_TEMP/layout-env/bin/python" -m build --wheel --outdir "$RUNNER_TEMP/candidate-wheel" candidate
      - name: Record baseline API and measurements
        run: |
          mkdir -p evidence "$RUNNER_TEMP/baseline-home" "$RUNNER_TEMP/candidate-home"
          python -m pip install -c unified/install/v2-constraints.txt "$RUNNER_TEMP"/base-wheel/*.whl scikit-learn
          python -m pip freeze > evidence/packages.txt
          HOME="$RUNNER_TEMP/baseline-home" python -I candidate/.github/scripts/core_layout_snapshot.py candidate/.github/scripts/core_layout_modules.json evidence/baseline.json
      - name: Record candidate API and measurements
        run: |
          python -m pip install --no-deps --force-reinstall "$RUNNER_TEMP"/candidate-wheel/*.whl
          HOME="$RUNNER_TEMP/candidate-home" python -I candidate/.github/scripts/core_layout_snapshot.py candidate/.github/scripts/core_layout_modules.json evidence/candidate.json
          python candidate/.github/scripts/core_layout_compare.py baseline candidate evidence
          mv evidence/comparison.json evidence/base-comparison.json
          # The check must also work when a future base has this folder layout.
          python candidate/.github/scripts/core_layout_compare.py candidate candidate evidence
          mv evidence/comparison.json evidence/organized-base-comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-layout-comparison
          path: evidence
