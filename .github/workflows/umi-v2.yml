name: UMI v2
on:
  pull_request:
    branches: [unified-model-interface-v2]
  push:
    branches: [unified-model-interface-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coordinated:
    name: UMI v2
    # Update the workflow and runner revision together.
    uses: KartikP/brainscore-unified/.github/workflows/offline-tests.yml@fd3bec0605731b9c72900dfd7e85137a3aa56312
    with:
      candidate: core
      candidate_repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      candidate_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      unified_revision: fd3bec0605731b9c72900dfd7e85137a3aa56312
