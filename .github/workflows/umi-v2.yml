name: UMI v2
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [unified-model-interface-v2]
  push:
    branches: [unified-model-interface-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coordinated:
    name: UMI v2
    # Update the workflow and runner revision together.
    uses: KartikP/brainscore-unified/.github/workflows/offline-tests.yml@8ed45c2b673aa5cb4c680d422d0aa5a1b4864c5f
    with:
      candidate: core
      candidate_repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      candidate_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      unified_revision: 8ed45c2b673aa5cb4c680d422d0aa5a1b4864c5f
