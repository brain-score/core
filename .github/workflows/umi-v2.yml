name: UMI v2
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [unified-model-interface-v2]
  push:
    branches: [unified-model-interface-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coordinated:
    name: UMI v2
    # Update the workflow and runner revision together.
    uses: KartikP/brainscore-unified/.github/workflows/offline-tests.yml@711b9fa13917cecdba16c13a68bb9d877f055c66
    with:
      candidate: core
      candidate_repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      candidate_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      unified_revision: 711b9fa13917cecdba16c13a68bb9d877f055c66
